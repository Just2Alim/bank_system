name: bank-system

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  orda-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: orda_core
      POSTGRES_USER: orda
      POSTGRES_PASSWORD: orda_dev
    ports:
      - "5433:5432"
    volumes:
      - orda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orda -d orda_core"]
      interval: 5s
      timeout: 5s
      retries: 20

  nomad-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: nomad_core
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: nomad_dev
    ports:
      - "5434:5432"
    volumes:
      - nomad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomad -d nomad_core"]
      interval: 5s
      timeout: 5s
      retries: 20

  tengri-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tengri_core
      POSTGRES_USER: tengri
      POSTGRES_PASSWORD: tengri_dev
    ports:
      - "5435:5432"
    volumes:
      - tengri-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tengri -d tengri_core"]
      interval: 5s
      timeout: 5s
      retries: 20

  legacy-core-simulator:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: legacy-core-simulator
    environment:
      BANK_CODE: ORDA
      BANK_SECURITY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://orda-db:5432/orda_core
      SPRING_DATASOURCE_USERNAME: orda
      SPRING_DATASOURCE_PASSWORD: orda_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      orda-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"

  nomad-bank:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: bank-platform
    environment:
      BANK_CODE: NOMAD
      BANK_CORE_MODE: native
      BANK_SECURITY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://nomad-db:5432/nomad_core
      SPRING_DATASOURCE_USERNAME: nomad
      SPRING_DATASOURCE_PASSWORD: nomad_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      nomad-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8082:8080"

  tengri-bank:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: bank-platform
    environment:
      BANK_CODE: TENGRI
      BANK_CORE_MODE: native
      BANK_SECURITY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://tengri-db:5432/tengri_core
      SPRING_DATASOURCE_USERNAME: tengri
      SPRING_DATASOURCE_PASSWORD: tengri_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      tengri-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8083:8080"

volumes:
  orda-db-data:
  nomad-db-data:
  tengri-db-data:
